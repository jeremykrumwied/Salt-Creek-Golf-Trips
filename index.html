<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weekend in the Thorns 2026</title>
    <style>
        :root {
            --forest-green: #1B4332;
            --light-green: #2D6A4F;
            --tan: #D8C3A5;
            --cream: #F8F9FA;
            --dark: #212529;
            --accent: #D4AF37;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #E9ECEF;
            color: var(--dark);
            line-height: 1.6;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            overflow: hidden;
        }
        .header {
            background-color: var(--forest-green);
            color: var(--tan);
            padding: 35px 20px;
            text-align: center;
            border-bottom: 4px solid var(--accent);
        }
        .header h1 {
            margin: 0;
            font-size: 2.2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .header p {
            margin: 10px 0 0;
            font-size: 1.1rem;
            color: white;
        }
        .section {
            padding: 25px;
            border-bottom: 1px solid #eee;
        }
        .section h2 {
            color: var(--forest-green);
            margin-top: 0;
            border-left: 4px solid var(--accent);
            padding-left: 12px;
            font-size: 1.4rem;
        }
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        @media (max-width: 600px) {
            .grid { grid-template-columns: 1fr; }
        }
        .card {
            background: var(--cream);
            padding: 18px;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
        }
        .card h3 {
            margin-top: 0;
            color: var(--forest-green);
        }
        .highlight-box {
            background: #E8F5E9;
            border: 2px solid var(--light-green);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .warning-box {
            background: #FFF3E0;
            border: 2px solid #FB8C00;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
        }
        .room-toggle {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .btn {
            background-color: var(--tan);
            color: var(--forest-green);
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1rem;
            flex: 1;
            transition: all 0.2s ease;
        }
        .btn.active {
            background-color: var(--forest-green);
            color: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .btn-venmo {
            display: inline-block;
            background-color: #008CFF;
            color: white;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: bold;
            margin-top: 15px;
            text-align: center;
        }
        .btn-venmo:hover {
            background-color: #0074D9;
        }
        ul {
            margin: 0;
            padding-left: 2
